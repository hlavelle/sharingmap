spring.profiles.include=prod

# ── Flyway (P0-T5) ────────────────────────────────────────────────────────────
# Shared across every profile: the baseline is the same operation everywhere, so it is
# declared once here instead of being triplicated in the three profile files.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Adopts an existing, already-populated schema by recording V1 as applied without
# running it. Required because V1 is a marker, not a schema dump.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Schema as built by Hibernate ddl-auto up to 2026-09

# ⚠ `spring.jpa.hibernate.ddl-auto` is deliberately left at `update` in every profile.
# Flyway now owns the VERSIONING, but not yet the schema definition — V1 carries no DDL,
# so Hibernate is still what creates tables on a fresh database. Moving to `validate`
# requires a real baseline dump first; see db/migration/V1__baseline.sql and task P0-T5.